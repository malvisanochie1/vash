# Every push to main that touches the app is delivered over the air:
# close and reopen the installed app to get it — no reinstall.
name: Publish OTA update

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

concurrency:
  group: ota-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Skip until the Expo project is linked
        id: linked
        run: |
          if node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Expo project not linked yet — run the 'Setup Expo project' workflow first." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.linked.outputs.ok == 'true'
        run: eas update --channel preview --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual update' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
