# Builds an installable Android APK in Expo's cloud and prints the download link.
# Run it from the Actions tab whenever native code changes (new native library,
# icon, app name). Everyday changes ship through the OTA workflow instead.
name: Build Android APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      - name: Publish download link
        run: |
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          ID=$(node -p "require('./build.json')[0].id")
          OWNER=$(node -p "require('./app.json').expo.owner")
          SLUG=$(node -p "require('./app.json').expo.slug")
          PAGE="https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          {
            echo "## 📱 APK ready"
            echo ""
            echo "**Download (open on your phone):** $URL"
            echo ""
            echo "Build page with install button and QR code: $PAGE"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $URL"
          echo "Page: $PAGE"
